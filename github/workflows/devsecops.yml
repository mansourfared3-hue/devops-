name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # Phase 3: Security Scans (DevSecOps)
  # ==========================================
  security-checks:
    name: DevSecOps Security Checks
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # مهم جداً لـ Gitleaks عشان يفحص تاريخ الـ Git بالكامل

      # 2. Gitleaks - Secret Detection
      - name: Run Gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Semgrep - Static Application Security Testing (SAST)
      - name: Run Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default # بيستخدم القواعد الأمنية القياسية لـ Semgrep

      # 4. Dependency Scan (npm audit)
      - name: Run Dependency Scan (npm audit)
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high
          else
            echo "No package.json found, skipping npm audit."
          fi

  # ==========================================
  # Phase 2: Build & Push + Trivy Image Scan
  # ==========================================
  build-and-push:
    name: Build, Scan Image & Push to Docker Hub
    needs: security-checks # يضمن إن البناء مش هيحصل إلا لو الفحوصات الأمنية نجحت
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build Docker Image locally first (without push)
      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true # بيحفظ الـ Image محلياً عشان Trivy يقدر يفحصها
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/alfredo-app:${{ github.sha }}

      # 4. Trivy - Scan Docker Image
      - name: Run Trivy Vulnerability Scanner on Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/alfredo-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # يوقف الـ Pipeline لو فيه ثغرات CRITICAL أو HIGH
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # 5. Push Image to Docker Hub (لو فحص Trivy نجح)
      - name: Push Docker Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/alfredo-app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/alfredo-app:latest