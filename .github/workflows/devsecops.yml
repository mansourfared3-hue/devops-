name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # Phase 1: Security Scans (DevSecOps)
  # ==========================================
  security-checks:
    name: DevSecOps Security Checks
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Gitleaks - Secret Detection
      - name: Run Gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Semgrep - Static Application Security Testing (SAST)
      - name: Run Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default

      # 4. Dependency Scan (npm audit)
      - name: Run Dependency Scan (npm audit)
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high
          else
            echo "No root package.json found, skipping root npm audit."
          fi

  # ==========================================
  # Phase 2: Build, Scan & Push (Frontend & Backend)
  # ==========================================
  build-and-push:
    name: Build, Scan & Push Images to Docker Hub
    needs: security-checks
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------
      # Frontend Image: Build, Scan & Push
      # --------------------------------------
      - name: Build Frontend Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ./frontend  # مسار الفولدر اللي فيه Dockerfile بتاع الـ Frontend
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:v1

      - name: Run Trivy Scanner on Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:v1'
          format: 'table'
          exit-code: '0' # غيرناها لـ 0 مؤقتاً عشان لو فيه تحذيرات بسيطة ما يوقفش الـ pipeline
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:latest

      # --------------------------------------
      # Backend Image: Build, Scan & Push
      # --------------------------------------
      - name: Build Backend Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ./backend  # مسار الفولدر اللي فيه Dockerfile بتاع الـ Backend
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:v1

      - name: Run Trivy Scanner on Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/backend-app:v1'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest